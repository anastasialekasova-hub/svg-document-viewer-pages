    <line class="tick" x1="172" y1="253" x2="188" y2="237"/><line class="tick" x1="172" y1="608" x2="188" y2="592"/>
    <text class="dimt" x="168" y="422" text-anchor="middle" transform="rotate(-90 168 422)">1 775</text>
    <line class="dim" x1="1340" y1="250" x2="1340" y2="180"/>
    <line class="dim" x1="1520" y1="250" x2="1520" y2="180"/>
    <line class="dim" x1="1330" y1="196" x2="1530" y2="196"/>
    <line class="tick" x1="1332" y1="204" x2="1348" y2="188"/><line class="tick" x1="1512" y1="204" x2="1528" y2="188"/>
    <text class="dimt" x="1430" y="184" text-anchor="middle">900</text>
