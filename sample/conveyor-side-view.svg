  <g>
    <text class="lbl" x="40" y="152">Tail pulley</text>
    <line class="lead" x1="150" y1="164" x2="266" y2="262"/>
    <text class="lbl" x="590" y="150">Feed hopper</text>
    <line class="lead" x1="586" y1="142" x2="548" y2="146"/>
    <text class="lbl" x="1070" y="160" text-anchor="middle">Carrying idlers</text>
    <line class="lead" x1="1100" y1="172" x2="1150" y2="252"/>
    <text class="lbl" x="1040" y="470" text-anchor="middle">Return rollers</text>
    <line class="lead" x1="1040" y1="440" x2="1040" y2="394"/>
