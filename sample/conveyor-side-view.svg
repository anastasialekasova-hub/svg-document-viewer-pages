    <rect class="steel" x="615" y="270" width="10" height="22"/><circle class="steel" cx="620" cy="270" r="20"/>
    <rect class="steel" x="795" y="270" width="10" height="22"/><circle class="steel" cx="800" cy="270" r="20"/>
    <rect class="steel" x="975" y="270" width="10" height="22"/><circle class="steel" cx="980" cy="270" r="20"/>
    <rect class="steel" x="1155" y="270" width="10" height="22"/><circle class="steel" cx="1160" cy="270" r="20"/>
    <rect class="steel" x="1335" y="270" width="10" height="22"/><circle class="steel" cx="1340" cy="270" r="20"/>
    <rect class="steel" x="1515" y="270" width="10" height="22"/><circle class="steel" cx="1520" cy="270" r="20"/>
    <rect class="steel" x="1695" y="270" width="10" height="22"/><circle class="steel" cx="1700" cy="270" r="20"/>
