<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="760" viewBox="0 0 2400 760">
  <title>Belt conveyor, side view</title>
  <!-- Drawn for the SVG Document Viewer store graphics. 1 unit = 5 mm. -->
  <style>
    .sheet{fill:#FFFFFF;stroke:#2A313B;stroke-width:3}
    .part{fill:#E6ECF3;stroke:#2A313B;stroke-width:4;stroke-linejoin:round}
    .steel{fill:#C9D3DF;stroke:#2A313B;stroke-width:4;stroke-linejoin:round}
    .thin{fill:none;stroke:#2A313B;stroke-width:2}
    .belt{fill:none;stroke:#1F2933;stroke-width:9;stroke-linejoin:round}
    .hub{fill:#2A313B}
    .axis{fill:none;stroke:#7B8794;stroke-width:2;stroke-dasharray:28 8 4 8}
    .floor{stroke:#2A313B;stroke-width:4}
    .hatch{stroke:#7B8794;stroke-width:2}
    .dim{fill:none;stroke:#2F5D8C;stroke-width:2}
    .tick{stroke:#2F5D8C;stroke-width:3}
    .dimt{fill:#2F5D8C;font:500 30px 'Segoe UI',Arial,sans-serif}
    .lbl{fill:#1F2933;font:600 30px 'Segoe UI',Arial,sans-serif}
    .lead{fill:none;stroke:#1F2933;stroke-width:2}
    .tbh{fill:#1F2933;font:700 30px 'Segoe UI',Arial,sans-serif}
    .tb{fill:#3E4C59;font:400 24px 'Segoe UI',Arial,sans-serif}
  </style>
