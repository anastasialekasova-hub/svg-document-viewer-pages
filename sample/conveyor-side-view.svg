    <line class="thin" x1="1980" y1="678" x2="2388" y2="678"/>
    <text class="tbh" x="2000" y="662">Belt conveyor BC-8</text>
    <text class="tb" x="2000" y="708">Side view · dimensions in mm</text>
    <text class="tb" x="2000" y="736">Drawing 01 · sheet 1 of 1</text>
